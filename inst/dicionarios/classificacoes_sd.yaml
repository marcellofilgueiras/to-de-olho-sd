# classificacoes_sd.yaml
# Dicionário de classificação temática — Câmara de Santos Dumont
# Três seções independentes:
#   temas_pl        → classifica Projetos de Lei pela ementa
#   req_urbano      → classifica Requerimentos de melhoria urbana
#   req_moc         → detecta Requerimentos que são na prática Moções

# ─────────────────────────────────────────────────────────────────────────────
# 1. TEMAS DOS PROJETOS DE LEI
# ─────────────────────────────────────────────────────────────────────────────
