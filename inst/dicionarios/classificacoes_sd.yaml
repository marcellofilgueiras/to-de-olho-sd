# ─────────────────────────────────────────────────────────────────────────────
# 2. SUBTIPOS DE REQUERIMENTOS URBANOS
# Detectados pela ementa; aplicados apenas a REQs
# ─────────────────────────────────────────────────────────────────────────────
req_urbano:

  capina_limpeza:
    - "capina|ro[cç]agem|mato alto|mato baixo"
    - "limpeza (de |do |da )?(rua|bairro|campo|cemit[eé]rio|c[oô]rrego|CEFEC)"
    - "poda (de |das? )?(árvore|[aá]rvores|galho)"
    - "limpeza e.*desobstru[cç][aã]o"

  pavimentacao:
    - "asfalto|asfaltamento|pavimenta[cç][aã]o|pavimentar"
    - "tapa.?buracos?|recapeamento|cascalhamento"
    - "buraco (na|em|do) (rua|via|estrada)"
    - "reparo.*pista|pista.*reparo"
    - "estrada rural|estrada vicinal"

  iluminacao:
    - "ilumina[cç][aã]o p[uú]blica"
    - "poste (de |d')?energia|poste.*luz"
    - "l[aâ]mpada|refletor"
    - "poste.*manutenção|manutenção.*poste"

  drenagem_bueiros:
    - "bueiro|boca de lobo"
    - "c[oô]rrego|vala|drenagem|galeria"
    - "esgoto|saneamento"
    - "inunda[cç][aã]o|alagamento|enchente"
    - "COPASA|abastecimento de água"
    - "muro de arrimo|contenção de encosta"

  calcada_acesso:
    - "cal[cç]ada|passeio p[uú]blico"
    - "escada de acesso|rampas? de acesso"
    - "acessibilidade.*cal[cç]ada|cal[cç]ada.*acessibilidade"

  mobilidade_transito:
    - "quebra.molas|redutor de velocidade|lombada"
    - "faixa de pedestre|zebrinha"
    - "[oô]nibus|transporte coletivo|linha de [oô]nibus|ponto de [oô]nibus"
    - "sinaliza[cç][aã]o (via|de tr[aâ]nsito|horizontal|vertical)"
    - "tr[aâ]fego|tr[aâ]nsito"
    - "moto.*taxi|mototaxi"

  infraestrutura_obras:
    - "constru[cç][aã]o (de |do |da )?(muro|escada|quadra|cobertura|telhado|ponte)"
    - "reforma (de |do |da )?(escola|pra[cç]a|campo|creche|cep|CEFEC)"
    - "micro.ondas|equipamento"
    - "ponto de [oô]nibus.*melhoria|melhoria.*ponto de [oô]nibus"
