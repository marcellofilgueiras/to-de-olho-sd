    - "pol[ií]cia|guarda municipal"
    - "c[aâ]mera de seguran[cç]a|videomonitoramento"

  animais:
    - "animal|animais"
    - "c[aã]o|c[aã]es|felino|gato|cachorro"
    - "maus.tratos|bem.estar animal"
    - "castra[cç][aã]o|zoonose"
    - "animal comunit[aá]rio|animal em situa[cç][aã]o de rua"

  assistencia_social:
    - "assist[eê]ncia social|vulnerabilidade"
