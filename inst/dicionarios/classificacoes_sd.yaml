    - "campo de futebol|quadra esportiva"
    - "cemit[eé]rio municipal"
    - "parque|pista de caminhada"

# ─────────────────────────────────────────────────────────────────────────────
# 3. REQUERIMENTOS QUE SÃO MOÇÕES (direcionados ao Plenário)
# Em Santos Dumont, moções entram como Requerimentos ao Plenário
